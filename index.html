<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header-title">Авторські картини від Сергія</h1>

      <nav class="header-links">
        <a class="header-link" href="#aboutMe">Про мене</a>
        <a class="header-link" href="#gallery">Галерея</a>
        <a class="header-link" href="#contacts">Контакти</a>
      </nav>
    </header>

    <main class="main">
      <section id="aboutMe" class="aboutMe">
        <div class="aboutMe-content">
          <h2 class="aboutMe-title">Привіт! Мене звати Сергій і я художник.</h2>
          <p class="aboutMe-text">
            Малюю картини в різних стилях та напрямках. Використовую акрилові
            фарби, олійні фарби, акварель та інші матеріали. Замовляйте картини
            на будь-яку тематику та розмір.
          </p>
        </div>
        <div class="aboutMe-container-img">
          <img src="imgs/Painter.jpg" alt="Painter" class="aboutMe-img" />
        </div>
      </section>

      <section class="gallery" id="gallery">
        <h2 class="gallery-title">Галерея</h2>

        <div id="gallery-imgs" class="gallery-imgs">
          <!-- Gallery images will be inserted here by JavaScript -->
        </div>
      </section>

      <section class="contacts" id="contacts">
        <div class="contacts-links">
          <a class="contacts-link-tel" href="tel:+380931473587">+38 (093) 147-35-87</a>
          <a
            class="contacts-link-instagram"
            href="https://www.instagram.com/franshchaksergei?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
            target="_blank"
          >
            <svg viewBox="0 0 24 24" class="icon">
              <path
                d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3h10zm-5 3.5A4.5 4.5 0 1 0 16.5 12 4.51 4.51 0 0 0 12 7.5zm0 7A2.5 2.5 0 1 1 14.5 12 2.5 2.5 0 0 1 12 14.5zM17.8 6.2a1 1 0 1 1-1.4 0 1 1 0 0 1 1.4 0z"
              ></path>
            </svg>
          </a>
          <a
            class="contacts-link-facebook"
            href="https://www.facebook.com/profile.php?id=100090017013419"
            target="_blank"
          >
            <svg viewBox="0 0 24 24" class="icon">
              <path
                d="M22 12a10 10 0 1 0-11.5 9.9v-7h-2v-3h2v-2.3c0-2 1.2-3.1 3-3.1 
           .9 0 1.8.1 1.8.1v2h-1c-1 0-1.3.6-1.3 1.2V12h2.3l-.4 3h-1.9v7A10 10 0 0 0 22 12z"
              ></path>
            </svg>
          </a>
        </div>
      </section>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="prev" class="nav-btn-left">←</button>

        <img id="modal-img" />

        <button id="next" class="nav-btn-right">→</button>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
